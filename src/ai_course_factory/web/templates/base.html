<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} · AI Course Factory</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="wordmark" href="/">AI Course Factory <span>offline workspace</span></a>
        <nav aria-label="Workspace">
          <a href="/">Start</a>
          <a href="/review">Review / Produce</a>
          <a href="/final">Final / Export</a>
        </nav>
      </div>
    </header>
    <main id="main" class="shell">
      {% if message %}
      <div class="notice notice-error" role="alert">{{ message }}</div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
    <footer class="shell site-footer">Local-only evidence workspace · deterministic Fixture media · no external providers</footer>
  </body>
</html>
